      - heading "How fake reviews are made — and how to catch them" [level=1] [ref=f7e23]
      - paragraph [ref=f7e24]: August 1, 2026 · 6 min read
      - generic [ref=f7e25]:
        - paragraph [ref=f7e26]: Fake reviews are a business. Some sellers pay for reviews directly, others use 'review clubs' where members trade five-star ratings, and a growing number use bots to flood a product page with near-identical praise within a single week.
        - paragraph [ref=f7e27]: The first tell is timing. Real reviews arrive steadily over a product's lifetime. Fake campaigns arrive in bursts — twenty reviews in two days, then nothing for months. Bursts are the single strongest signal that a page has been gamed.
        - paragraph [ref=f7e28]: "The second tell is language. Bought reviews reuse a narrow vocabulary of superlatives ('amazing', 'perfect', 'best ever') and rarely describe a specific use case. Genuine reviews mention real details: how the product was used, how it held up, what disappointed them."
        - paragraph [ref=f7e29]: The third tell is the reviewer itself. Fresh accounts with no purchase history, reviews posted minutes apart, or the same phrasing appearing across many products are classic bot signatures.
        - paragraph [ref=f7e30]: Nicerella scans for all of these automatically — timing patterns, duplicate phrasing, incentivized language, and reviewer behavior — and distills the result into a single trust score you can read at a glance.
